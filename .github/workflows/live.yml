name: Live model tests (manual)
# Spends real Groq quota, so it never runs on push/PR. Trigger from the Actions tab.
on: workflow_dispatch
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Live workflow tests (real Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest tests/workflow/test_live_groq.py -m live -q -rs
