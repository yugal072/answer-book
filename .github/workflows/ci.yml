name: CI
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push, pull_request]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a `${{ github.event_name }}` event."
      - run: echo "🐧 This job is now running on the `ubuntu-latest` runner."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "💡 The **${{ github.repository }}** repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 The job's status is currently ${{ job.status }}."

  offline-tests:
    name: Offline tests (ingestion corpus, workflow graph, API, PDF, SSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Application import / startup smoke test
        run: |
          python -c "import app.main; print('app.main imports')"
          python -m app.workflow.visualize > /dev/null
          python -m app.workflow.cli --help > /dev/null
      - name: Run the offline suite
        # Excludes tests that need a real model API (live) or a real PostgreSQL (db).
        # Provider calls inside the graph tests are scripted; everything else
        # (graphs, verifier, cache policy, API, SSE, PDF, real PDF corpus) is real.
        run: pytest tests -m "not live and not db" -q -rs

  database-tests:
    name: Database tests (real PostgreSQL service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ab
          POSTGRES_PASSWORD: ab
          POSTGRES_DB: ab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ab -d ab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ab:ab@localhost:5432/ab_test
      DATABASE_URL: postgresql://ab:ab@localhost:5432/ab_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Workflow persistence, cache and checkpoint tests on PostgreSQL
        # These create and drop their own tables, so they run before the
        # legacy suite and never share a step with it.
        run: pytest tests/workflow/test_persistence.py -q -rs
      - name: Legacy database tests on PostgreSQL
        run: |
          python -m app.store.init_db
          pytest tests/test_database.py -q -rs
